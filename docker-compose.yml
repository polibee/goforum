services:
  goforum:
    build:
      context: .
      args:
        VERSION: ${GOFORUM_VERSION:-dev}
        GOPROXY: ${GOPROXY:-https://proxy.golang.org,direct}
    image: goforum:local
    container_name: goforum
    restart: unless-stopped
    env_file:
      - ./goforum.env
    environment:
      GF_ENV_FILE: /data/.env
      GF_CONFIG: /data/goforum.yaml
    ports:
      - "${GOFORUM_PORT:-8080}:8080"
    volumes:
      - goforum-data:/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    stop_grace_period: 15s

volumes:
  goforum-data:
