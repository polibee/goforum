{{define "content_tabs"}}
<div class="flex w-fit flex-wrap gap-1 rounded-xl border border-border bg-surface p-1 shadow-sm">
  <a href="/admin/topics" class="rounded-lg px-3 py-1.5 text-[13px] font-medium {{if eq .Path "/admin/topics"}}bg-brand-50 text-brand-700 dark:bg-brand-900 dark:text-brand-200{{else}}text-fg-muted hover:bg-surface-muted hover:text-fg{{end}}">{{t "主题" .Lang}}</a>
  <a href="/admin/posts" class="rounded-lg px-3 py-1.5 text-[13px] font-medium {{if eq .Path "/admin/posts"}}bg-brand-50 text-brand-700 dark:bg-brand-900 dark:text-brand-200{{else}}text-fg-muted hover:bg-surface-muted hover:text-fg{{end}}">{{t "回复" .Lang}}</a>
  <a href="/admin/categories" class="rounded-lg px-3 py-1.5 text-[13px] font-medium {{if eq .Path "/admin/categories"}}bg-brand-50 text-brand-700 dark:bg-brand-900 dark:text-brand-200{{else}}text-fg-muted hover:bg-surface-muted hover:text-fg{{end}}">{{t "板块" .Lang}}</a>
  <a href="/admin/tags" class="rounded-lg px-3 py-1.5 text-[13px] font-medium {{if eq .Path "/admin/tags"}}bg-brand-50 text-brand-700 dark:bg-brand-900 dark:text-brand-200{{else}}text-fg-muted hover:bg-surface-muted hover:text-fg{{end}}">{{t "标签" .Lang}}</a>
</div>
{{end}}
