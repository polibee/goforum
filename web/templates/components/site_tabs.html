{{define "site_tabs"}}
<div class="flex w-fit flex-wrap gap-1 rounded-xl border border-border bg-surface p-1 shadow-sm">
  <a href="/admin/site/pages" class="flex items-center gap-1.5 rounded-lg px-3 py-1.5 text-[13px] font-medium transition {{if or (eq .Path "/admin/site/pages") (hasPrefix .Path "/admin/site/pages/")}}bg-brand-50 text-brand-700 dark:bg-brand-900 dark:text-brand-200{{else}}text-fg-muted hover:bg-surface-muted hover:text-fg{{end}}">
    <svg class="h-3.5 w-3.5" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M5 3.5h7l3 3v10H5v-13Z" stroke-linejoin="round"/><path d="M7.5 9h5M7.5 11.5h5M7.5 14h3" stroke-linecap="round"/></svg>
    {{t "页面" .Lang}}
  </a>
  <a href="/admin/site/header" class="flex items-center gap-1.5 rounded-lg px-3 py-1.5 text-[13px] font-medium transition {{if eq .Path "/admin/site/header"}}bg-brand-50 text-brand-700 dark:bg-brand-900 dark:text-brand-200{{else}}text-fg-muted hover:bg-surface-muted hover:text-fg{{end}}">
    <svg class="h-3.5 w-3.5" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3" y="4" width="14" height="3.5" rx="1"/><path d="M5 11h4M5 14h7M13 11h2" stroke-linecap="round"/></svg>
    {{t "页眉导航" .Lang}}
  </a>
  <a href="/admin/site/footer" class="flex items-center gap-1.5 rounded-lg px-3 py-1.5 text-[13px] font-medium transition {{if eq .Path "/admin/site/footer"}}bg-brand-50 text-brand-700 dark:bg-brand-900 dark:text-brand-200{{else}}text-fg-muted hover:bg-surface-muted hover:text-fg{{end}}">
    <svg class="h-3.5 w-3.5" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3" y="12.5" width="14" height="3.5" rx="1"/><path d="M5 6h4M5 9h7M13 6h2" stroke-linecap="round"/></svg>
    {{t "页脚导航" .Lang}}
  </a>
  <a href="/admin/site/sidebar" class="flex items-center gap-1.5 rounded-lg px-3 py-1.5 text-[13px] font-medium transition {{if eq .Path "/admin/site/sidebar"}}bg-brand-50 text-brand-700 dark:bg-brand-900 dark:text-brand-200{{else}}text-fg-muted hover:bg-surface-muted hover:text-fg{{end}}">
    <svg class="h-3.5 w-3.5" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3" y="3.5" width="14" height="13" rx="1.5"/><path d="M12 3.5v13" stroke-linecap="round"/></svg>
    {{t "侧边栏卡片" .Lang}}
  </a>
</div>
{{end}}
