{{define "moderation_tabs"}}

  <a href="/admin/review" class="rounded-lg px-3 py-1.5 text-[13px] font-medium {{if eq .Path "/admin/review"}}bg-brand-50 text-brand-700 dark:bg-brand-900 dark:text-brand-200{{else}}text-fg-muted hover:bg-surface-muted hover:text-fg{{end}}">{{t "审核队列" .Lang}}</a>
  <a href="/admin/appeals" class="rounded-lg px-3 py-1.5 text-[13px] font-medium {{if eq .Path "/admin/appeals"}}bg-brand-50 text-brand-700 dark:bg-brand-900 dark:text-brand-200{{else}}text-fg-muted hover:bg-surface-muted hover:text-fg{{end}}">{{t "账号申诉" .Lang}}</a>
  <a href="/admin/banned-words" class="rounded-lg px-3 py-1.5 text-[13px] font-medium {{if eq .Path "/admin/banned-words"}}bg-brand-50 text-brand-700 dark:bg-brand-900 dark:text-brand-200{{else}}text-fg-muted hover:bg-surface-muted hover:text-fg{{end}}">{{t "敏感词" .Lang}}</a>
