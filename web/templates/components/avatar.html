{{define "avatar"}}
{{if .URL}}<img src="{{.URL}}" alt="" loading="lazy" class="{{.Class}} shrink-0 rounded-full object-cover">{{else}}<div class="{{.Class}} flex shrink-0 items-center justify-center rounded-full bg-brand-50 font-semibold text-brand-700 dark:bg-brand-900 dark:text-brand-200">{{initial .Name}}</div>{{end}}
{{end}}
