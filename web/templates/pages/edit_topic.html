{{define "page"}}
<div class="mx-auto max-w-3xl px-4 py-8">
  {{with .Data}}
  <div class="flex flex-wrap items-end justify-between gap-3">
    <div>
      <h1 class="text-2xl font-semibold">{{t "编辑主题" $.Lang}}</h1>
      <p class="mt-1 text-sm text-fg-muted">{{t "修改标题与正文，保存后保留历史版本。" $.Lang}}</p>
    </div>
    <a href="/t/{{.Topic.Number}}" class="gf-btn gf-btn-ghost">{{t "取消" $.Lang}}</a>
  </div>

  {{if .Error}}<div class="gf-alert-danger mt-4">{{t .Error $.Lang}}</div>{{end}}

  <form method="post" action="/t/{{.Topic.Number}}/edit" class="gf-card mt-5 p-5">
    <input type="hidden" name="_csrf" value="{{$.CSRF}}">
    <label class="gf-label" for="title">{{t "标题" $.Lang}}</label>
    <input id="title" name="title" value="{{.Topic.Title}}" maxlength="120" class="gf-input" required>

    <label class="gf-label mt-4" for="raw">{{t "正文" $.Lang}}</label>
    <div x-data="editor" data-draft-key="gf-draft-topic-edit-{{.Topic.Number}}" data-invalid-url="{{t "请输入有效的 http/https 链接" $.Lang}}">
      <div class="mb-2 flex flex-wrap items-center justify-between gap-2">
        <div class="flex gap-1">
          <button type="button" x-on:click="showContent" class="gf-btn gf-btn-ghost !px-2 !py-1 text-xs">{{t "内容" $.Lang}}</button>
          <button type="button" x-on:click="showPreview" class="gf-btn gf-btn-ghost !px-2 !py-1 text-xs">{{t "预览" $.Lang}}</button>
          <button type="button" x-on:click="showSplit" class="gf-btn gf-btn-ghost !px-2 !py-1 text-xs">{{t "对照" $.Lang}}</button>
        </div>
        <div class="flex items-center gap-2 text-xs text-fg-muted">
          <span x-show="draftSaved" x-cloak>{{t "草稿已保存" $.Lang}}</span>
          <button type="button" x-on:click="clearDraft" class="hover:text-fg">{{t "清除草稿" $.Lang}}</button>
        </div>
      </div>
      <div x-show="contentVisible" class="mb-2 flex flex-wrap gap-1">
        <button type="button" x-on:click="bold" class="gf-btn gf-btn-ghost !px-2 !py-1 text-xs font-bold" title="Bold">B</button>
        <button type="button" x-on:click="italic" class="gf-btn gf-btn-ghost !px-2 !py-1 text-xs italic" title="Italic">I</button>
        <button type="button" x-on:click="code" class="gf-btn gf-btn-ghost !px-2 !py-1 text-xs font-mono" title="Code">&lt;/&gt;</button>
        <button type="button" x-on:click="heading" class="gf-btn gf-btn-ghost !px-2 !py-1 text-xs" title="Heading">H</button>
        <button type="button" x-on:click="quote" class="gf-btn gf-btn-ghost !px-2 !py-1 text-xs" title="Quote">❝</button>
        <button type="button" x-on:click="openLink" class="gf-btn gf-btn-ghost !px-2 !py-1 text-xs" title="Link">🔗</button>
        <button type="button" x-on:click="bullet" class="gf-btn gf-btn-ghost !px-2 !py-1 text-xs" title="Bullet list">•</button>
        <button type="button" x-on:click="ordered" class="gf-btn gf-btn-ghost !px-2 !py-1 text-xs" title="Numbered list">1.</button>
      </div>
      <div id="editor-panels" class="grid gap-3">
        <div class="relative">
          {{template "editor_mentions" $}}
          <textarea id="raw" name="raw" x-show="contentVisible" rows="14" class="gf-input font-mono text-sm" placeholder="{{t "支持 Markdown…" $.Lang}}" required>{{.Raw}}</textarea>
        </div>
        <div x-show="previewVisible" x-cloak class="min-h-[16rem] rounded-md border border-border bg-surface p-4">
          <div x-show="loading" class="text-sm text-fg-muted">{{t "加载中…" $.Lang}}</div>
          <div id="preview" class="gf-prose"></div>
        </div>
      </div>
      {{template "editor_modal" $}}
    </div>

    <div class="mt-5 flex justify-end gap-2">
      <a href="/t/{{.Topic.Number}}" class="gf-btn gf-btn-ghost">{{t "取消" $.Lang}}</a>
      <button type="submit" class="gf-btn gf-btn-primary">{{t "保存修改" $.Lang}}</button>
    </div>
  </form>
  {{end}}
</div>
{{end}}
