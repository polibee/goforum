# ============================================================
# 旧版 YAML 配置（仍然支持，但推荐使用 .env）
#
# 生效顺序：内置默认值 → 本文件 → .env → 真实环境变量
# .env 会覆盖本文件中的同名配置，因此数据库等推荐写在 .env。
# 参考根目录的 .env.example。
# ============================================================
env: production

http:
  addr: ":8080"
  base_url: "https://forum.example.com"
  max_body_bytes: 33554432
  metrics_enabled: false
  metrics_token: ""

# 注意：数据库配置建议写在 .env（DB_CONNECTION / DB_HOST / DB_DATABASE …）
database:
  driver: postgres
  dsn: "host=127.0.0.1 user=goforum password=change-me dbname=goforum port=5432 sslmode=disable TimeZone=UTC"
  max_open: 25
  max_idle: 10
  conn_max_lifetime: 30m

cache:
  driver: memory
  ttl: 5m

storage:
  driver: local
  local_path: ./data/uploads
  base_url: /uploads

mail:
  enabled: false
  smtp_host: ""
  smtp_port: 587
  username: ""
  password: ""
  from: ""

log:
  level: info
  format: json

security:
  secret_key: "change-me-32-bytes-base64"
  session_ttl: 720h
  session_cookie: gf_session

worker:
  enabled: true
